name: channelbase

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: channelbase
      POSTGRES_PASSWORD: channelbase
      POSTGRES_DB: channelbase
    ports:
      - "5432:5432"
    volumes:
      - channelbase_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U channelbase"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - channelbase_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: channelbase
      MINIO_ROOT_PASSWORD: channelbase123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - channelbase_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  channelbase_postgres_data:
  channelbase_redis_data:
  channelbase_minio_data:
